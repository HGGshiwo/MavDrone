mikepenz-iconics-views = { group = "com.mikepenz", name = "iconics-views", version.ref = "mikepenzIconicsViews" }
mikepenz-ionicons = { group = "com.mikepenz", name = "ionicons-typeface", version.ref = "mikepenzIonicons" }

jetbrains-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk7", version.ref = "jetbrainsKotlin" }

[plugins]
android-gradle-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-gradle-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "jetbrainsKotlinAndroidPlugin" }
jetbrains-kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "jetbrainsKotlinKaptPlugin" }
