mikepenz-community-material = { group = "com.mikepenz", name = "community-material-typeface", version.ref = "mikepenzCommunityMaterial" }
mikepenz-google-material = { group = "com.mikepenz", name = "google-material-typeface", version.ref = "mikepenzGoogleMaterial" }
